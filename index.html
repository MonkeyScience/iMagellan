<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>iMagellan</title>
</head>
<body style="margin:0;background:#071018">
<script>
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  return fetch("/api/streams").then(function(r){return r.json();}).catch(function(){return null;}).then(function(cur){
    window.__IM_CUR=cur;
    html=html.replace("function stateAt(min){const src=LIVE||SNAP;","function stateAt(min){min=((+min%1440)+1440)%1440;const src=LIVE||SNAP;");
    html=html.replace("function streamAt(min){","function streamFromCur(lon,lat,min){var C=window.__IM_CUR;if(!C||!C.stations)return null;var best=null,bd=1e9;for(var i=0;i<C.stations.length;i++){var s=C.stations[i],d=(s.lon-lon)*(s.lon-lon)+(s.lat-lat)*(s.lat-lat);if(d<bd){bd=d;best=s;}}if(!best||!best.hours)return null;var rows=best.hours,j=0;while(j<rows.length-2&&rows[j+1].min<min)j++;var A=rows[j],B=rows[j+1]||A,u=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);var kn=(+A.kn||0)+((+B.kn||0)-(+A.kn||0))*u;var dir=+A.dir||0;var ph=kn<0.28?'slack':((dir<90||dir>270)?'flood':'ebb');return {kn:kn,dir:dir,phase:ph,signed:(ph==='flood'?-kn:kn)};}function streamAt(min){var g=streamFromCur(-2.50,49.43,min);if(g)return g;");
    html=html.replace("const kn=s.kn*st[2], rad=s.dir*Math.PI/180, len=6+kn*20;","var loc=streamFromCur(st[0],st[1],min); const kn=loc?loc.kn:(s.kn*st[2]), rad=(loc?loc.dir:s.dir)*Math.PI/180, len=6+kn*20;");
    document.open(); document.write(html); document.close();
    var s=document.createElement("script");
    s.src="/noop.js";
    document.body.appendChild(s);
  });
})
.catch(function(){document.body.style.color="#eef4fa";document.body.textContent="Failed to load iMagellan. Hard-refresh.";});
</script>
</body>
</html>
