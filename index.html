<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<link rel="manifest" href="/manifest.webmanifest"/>
</head>
<body style="margin:0;background:#071018">
<script>
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  document.open();
  document.write(html);
  document.close();
  var s=document.createElement("script");
  s.textContent="(function(){function hh(m){m=((+m%1440)+1440)%1440;var h=Math.floor(m/60),n=Math.floor(m%60);return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}function tx(id){var n=document.getElementById(id);return n&&n.textContent?n.textContent.replace(/^\\s+|\\s+$/g,''):'';}function paint(){var sum=document.getElementById('rsum');if(!sum||!sum.parentNode)return;var el=document.getElementById('rbrief');if(!el){el=document.createElement('p');el.id='rbrief';el.className='note';sum.parentNode.insertBefore(el,sum.nextSibling);}var depEl=document.getElementById('dep'),tEl=document.getElementById('t');if(!depEl||!tEl){el.textContent='Briefing waiting for the map.';return;}var dep=+depEl.value,now=+tEl.value;var rf=document.getElementById('rfrom'),rt=document.getElementById('rto');var fn=rf&&rf.options[rf.selectedIndex]?rf.options[rf.selectedIndex].text:'St Peter Port';var tn=rt&&rt.options[rt.selectedIndex]?rt.options[rt.selectedIndex].text:'Les Sablons';var east=document.getElementById('vEJer')&&document.getElementById('vEJer').checked;var side=east?'east of Jersey':'west of Jersey and the Minquiers';var other=east?'West-about would keep you off the east side of Jersey.':'East-about would put you on the east side of Jersey, where the stream is usually harder.';el.textContent='Leave '+hh(dep)+' '+fn+' to '+tn+', '+side+'. '+tx('left')+' left, arrive '+tx('eta')+'. At '+hh(now)+' stream '+tx('sv')+' kn '+tx('sd')+', wind '+tx('wv')+' '+tx('wg')+'. SPP '+tx('sppNow')+', next '+tx('sppNext')+'. St-Malo '+tx('malNow')+', next '+tx('malNext')+'. '+other+' Not a chart.';}setTimeout(paint,1200);setInterval(paint,1000);})();";
  document.body.appendChild(s);
})
.catch(function(){
  document.body.style.cssText="color:#eef4fa;font-family:system-ui;padding:24px";
  document.body.textContent="Failed to load iMagellan. Hard-refresh.";
});
</script>
</body>
</html>
