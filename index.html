<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<link rel="manifest" href="/manifest.webmanifest"/>
</head>
<body style="margin:0;background:#071018">
<script>
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  html=html.replace('function streamAt(min){','function streamAt(min){if(window.__smocAt){var u=window.__smocAt(min);if(u)return u;}');
  html=html.replace('slack-safe stream','8 km stream');
  html=html.replace('function stateAt(min){','function stateAt(min){min=((+min%1440)+1440)%1440;');
  html=html.replace('const kn=s.kn*st[2], rad=s.dir*Math.PI/180, len=6+kn*20;','var loc=window.__smocStn?window.__smocStn(st[0],st[1],s):null;const kn=(loc?loc.kn:s.kn*st[2]), rad=(loc?loc.dir:s.dir)*Math.PI/180, len=6+kn*20;');
  document.open();
  document.write(html);
  document.close();
  var s=document.createElement("script");
  s.src="/app.js?v=sum2";
  s.onerror=function(){console.warn("app.js missing");};
  document.body.appendChild(s);
})
.catch(function(){
  document.body.style.cssText="color:#eef4fa;font-family:system-ui;padding:24px";
  document.body.textContent="Failed to load iMagellan. Hard-refresh.";
});
</script>
</body>
</html>
