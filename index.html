<body style="margin:0;background:#071018">
<script>
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  document.open();
  document.write(html);
  document.close();
  var s=document.createElement("script");
  s.textContent="(function(){function hh(m){m=((+m%1440)+1440)%1440;var h=Math.floor(m/60),n=Math.floor(m%60);return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}function tx(id){var n=document.getElementById(id);return n&&n.textContent?n.textContent.replace(/^\\s+|\\s+$/g,''):'';}function parseEta(s,dep){var m=(s||'').match(/(\\d{1,2}):(\\d{2})/);if(!m)return dep+540;var v=(+m[1])*60+(+m[2]);if(v<dep)v+=1440;return v;}var CUR=null,TIDE=null;fetch('/api/streams').then(function(r){return r.json();}).then(function(d){CUR=d;paint();}).catch(function(){});fetch('/api/tides').then(function(r){return r.json();}).then(function(d){TIDE=d;paint();}).catch(function(){});function hourRow(rows,min){if(!rows||!rows.length)return null;var i=0;while(i<rows.length-2&&rows[i+1].min<min)i++;var A=rows[i],B=rows[i+1]||A,t=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);return {kn:(+A.kn||0)+((+B.kn||0)-(+A.kn||0))*t,dir:+A.dir||0};}function gate(id,label,min){if(!CUR||!CUR.stations)return '';var st=CUR.stations.find(function(x){return x.id===id;});if(!st)return '';var row=hourRow(st.hours,min);if(!row)return '';var ph=row.kn<0.28?'slack':((row.dir<90||row.dir>270)?'flood':'ebb');return label+' '+ph+' '+row.kn.toFixed(1)+' kn';}function toMin(iso){if(!iso)return 0;var o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(p){o[p.type]=p.value;});var off=Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(+o.year,+o.month-1,+o.day))/86400000);return off*1440+(+iso.slice(11,13))*60+(+iso.slice(14,16)||0);}function evs(id){if(!TIDE||!TIDE.ports)return [];var p=TIDE.ports.find(function(x){return x.id===id;});if(!p||!p.events)return [];return p.events.map(function(e){return [toMin(e.t),+e.h,e.type];}).filter(function(a){return isFinite(a[0])&&isFinite(a[1]);}).sort(function(a,b){return a[0]-b[0];});}function hAt(id,min){var s=evs(id);if(s.length<2)return '';var i=0;while(i<s.length-2&&s[i+1][0]<min)i++;var A=s[i],B=s[i+1]||A,t=(min-A[0])/Math.max(1,B[0]-A[0]);var h=A[1]+(B[1]-A[1])*Math.max(0,Math.min(1,t));return h.toFixed(1)+' m CD';}function nxt(id,min){var s=evs(id);for(var i=0;i<s.length;i++)if(s[i][0]>min)return s[i][2]+' '+hh(s[i][0])+' '+s[i][1].toFixed(1)+' m';return '';}function paint(){var sum=document.getElementById('rsum');if(!sum||!sum.parentNode)return;var el=document.getElementById('rbrief');if(!el){el=document.createElement('p');el.id='rbrief';el.className='note';el.style.cssText='white-space:pre-wrap;line-height:1.45';sum.parentNode.insertBefore(el,sum.nextSibling);}var depEl=document.getElementById('dep'),tEl=document.getElementById('t');if(!depEl||!tEl){el.textContent='Open Map once so the clocks exist, then come back to Route.';return;}var dep=+depEl.value,now=+tEl.value,eta=parseEta(tx('eta'),dep);var rf=document.getElementById('rfrom'),rt=document.getElementById('rto');var fn=rf&&rf.options[rf.selectedIndex]?rf.options[rf.selectedIndex].text:'St Peter Port';var tn=rt&&rt.options[rt.selectedIndex]?rt.options[rt.selectedIndex].text:'Les Sablons';var east=document.getElementById('vEJer')&&document.getElementById('vEJer').checked;var side=east?'east-about':'west-about';var other=east?'West-about keeps Jersey to starboard.':'East-about puts you the other side of Jersey and the Minquiers.';var lines=[];lines.push('Leave '+hh(dep)+' '+side+' from '+fn+' to '+tn+'.');var hs=hAt('spp',dep);if(hs)lines.push('Leave SPP '+hs+(nxt('spp',dep)?', next '+nxt('spp',dep):'')+'.');lines.push('At leave: '+gate('russell','Little Russell',dep)+'.');lines.push('+1h '+hh(dep+60)+' '+gate('russell','Russell',dep+60)+'.');lines.push('+3h '+hh(dep+180)+' '+gate('minqw','Minquiers',dep+180)+'.');lines.push('+6h '+hh(dep+360)+' '+gate('minqw','Minquiers',dep+360)+'.');lines.push('Arrive '+hh(eta)+' '+gate('sablons','Sablons',eta)+'.');var ha=hAt('sablons',eta);if(ha){lines.push('Arrive St-Malo '+ha+(nxt('sablons',eta)?', next '+nxt('sablons',eta):'')+'.');var ov=parseFloat(ha);if(isFinite(ov))lines.push('Sablons sill +2.0 m CD, so about '+(ov-2).toFixed(1)+' m over the sill.');}lines.push('Slider '+hh(now)+': '+(tx('who')||'On passage')+', '+tx('left')+' left, wind '+tx('wv')+' '+tx('wg')+'.');lines.push('Why not the other way: '+other);lines.push('Planning sketch. Not a chart. Stream is the 8 km model.');el.textContent=lines.join('\\n');}setTimeout(paint,800);setInterval(paint,1000);})();";
  document.body.appendChild(s);
  var g=document.createElement("script");
  g.textContent="(function(){function hh(m){m=((+m%1440)+1440)%1440;var h=Math.floor(m/60),n=Math.floor(m%60);return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}function setTime(m){var t=document.getElementById('t');if(!t)return;var lo=+t.min||0,hi=+t.max||1439;if(m<lo)m=lo;if(m>hi)m=hi;t.value=Math.round(m);try{t.dispatchEvent(new Event('input'));}catch(e){}}function addSliderScale(){var t=document.getElementById('t');if(!t||t.dataset.ax)return;t.dataset.ax='1';var bar=document.createElement('div');bar.style.cssText='display:flex;justify-content:space-between;font-size:10px;color:#9bb0c3;padding:0 4px';var lo=+t.min,hi=+t.max,step=180;for(var m=lo;m<=hi;m+=step){var s=document.createElement('span');s.textContent=hh(m);bar.appendChild(s);}t.parentNode.appendChild(bar);}function addTideScale(){var c=document.getElementById('tg');if(!c||c.dataset.ax)return;c.dataset.ax='1';var ys=document.createElement('div');ys.textContent='Height 10 m CD (top) to 0 (bottom)';ys.style.cssText='font-size:10px;color:#9bb0c3';c.parentNode.insertBefore(ys,c);var bar=document.createElement('div');bar.style.cssText='display:flex;justify-content:space-between;font-size:10px;color:#9bb0c3';['00h','06h','12h','18h','24h','30h','36h'].forEach(function(l){var s=document.createElement('span');s.textContent=l;bar.appendChild(s);});c.parentNode.insertBefore(bar,c.nextSibling);}function bindScrub(id,t0,t1,padL,padR){var c=document.getElementById(id);if(!c||c.dataset.sc)return;c.dataset.sc='1';c.style.cursor='crosshair';var tip=document.createElement('div');tip.style.cssText='font-size:11px;color:#e6b35a;min-height:16px';c.parentNode.insertBefore(tip,c.nextSibling);function at(ev){var r=c.getBoundingClientRect();var x=ev.clientX-r.left;var a=padL,b=r.width-padR;var u=(x-a)/Math.max(1,b-a);if(u<0)u=0;if(u>1)u=1;var m=t0+u*(t1-t0);setTime(m);var extra='';var spp=document.getElementById('sppNow'),mal=document.getElementById('malNow');if(id==='tg'&&spp)extra='  SPP '+(spp.textContent||'')+'  St-Malo '+((mal&&mal.textContent)||'');tip.textContent=hh(m)+extra;}c.addEventListener('mousemove',at);c.addEventListener('click',at);}function boot(){var t=document.getElementById('t');if(t){t.min=0;t.max=2159;}addSliderScale();addTideScale();bindScrub('tg',0,2160,0,0);bindScrub('win',300,1440,70,10);}setTimeout(boot,1500);})();";
  document.body.appendChild(g);
})
