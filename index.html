<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<link rel="manifest" href="/manifest.webmanifest"/>
</head>
<body style="margin:0;background:#071018">
<script>
(function(){
var patch = "<scr"+"ipt>(function(){\n"+
"var ALIAS={spp:['spp','st peter','peter port','guernsey','st james','st. james'],sark:['sark'],helier:['helier','st helier'],sablons:['sablons','st malo','st-malo','stmalo','saint malo'],granville:['granville'],carteret:['carteret']};\n"+
"function findPort(s,which){var hit=null,idx=which==='from'?999:-1;Object.keys(ALIAS).forEach(function(k){ALIAS[k].forEach(function(a){var i=s.indexOf(a);if(i<0)return;if(which==='from'&&(hit===null||i<idx)){hit=k;idx=i;}if(which==='to'&&i>idx){hit=k;idx=i;}});});return hit;}\n"+
"function parsePrompt(){\n"+
"  var box=document.getElementById('rprompt');if(!box)return;\n"+
"  var raw=(box.value||'').toLowerCase();\n"+
"  var s=raw.replace(/west[- ]?about/g,' ').replace(/east[- ]?about/g,' ').replace(/west of (the )?(jersey|minquiers)/g,' ').replace(/east of (the )?(jersey|minquiers)/g,' ');\n"+
"  var fk=findPort(s,'from')||'spp',tk=findPort(s,'to');if(!tk||tk===fk)tk='sablons';\n"+
"  var east=/east[- ]?about|east of jersey|east of the minquiers/.test(raw);\n"+
"  var west=/west[- ]?about|west of jersey|west of the minquiers/.test(raw);\n"+
"  var rf=document.getElementById('rfrom'),rt=document.getElementById('rto');\n"+
"  if(rf)rf.value=fk;if(rt)rt.value=tk;\n"+
"  var r=document.getElementById('vRuss');if(r)r.checked=!/avoid russell|skip russell/.test(raw);\n"+
"  var wj=document.getElementById('vWJer');if(wj)wj.checked=!east;\n"+
"  var wm=document.getElementById('vWMin');if(wm)wm.checked=!east;\n"+
"  var ej=document.getElementById('vEJer');if(ej)ej.checked=!!east&&!west;\n"+
"  var lm=raw.match(/leav\\w*\\s+(?:at\\s+)?(\\d{1,2})(?:[:.](\\d{2}))?/);\n"+
"  if(lm){var dep=(+lm[1])*60+(+(lm[2]||0));var d=document.getElementById('dep');if(d)d.value=dep;var t=document.getElementById('t');if(t)t.value=dep;}\n"+
"  var go=document.getElementById('rapply');if(go)go.click();\n"+
"  var out=document.getElementById('rparseOut');\n"+
"  if(out){var fn=rf&&rf.options[rf.selectedIndex]?rf.options[rf.selectedIndex].text:fk;var tn=rt&&rt.options[rt.selectedIndex]?rt.options[rt.selectedIndex].text:tk;out.textContent='Built '+fn+' to '+tn+(east?' · east-about':west?' · west-about':'');}\n"+
"}\n"+
"var btn=document.getElementById('rparse');if(btn)btn.onclick=parsePrompt;\n"+
"})();</scr"+"ipt>";
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  html=html
    .replace('id="t" type="range" min="360" max="1140"','id="t" type="range" min="0" max="1439"')
    .replace('id="dep" type="range" min="360" max="510"','id="dep" type="range" min="0" max="1439"')
    .replace('.field input,.field select{width:100%}','.field input,.field select,.field textarea{width:100%}.field textarea{min-height:64px;resize:vertical;font:inherit;background:#1c2a36;color:#eef4fa;border:0;border-radius:8px;padding:6px 8px}')
    .replace('<h2>Route</h2>',
      '<h2>Ask for a route</h2>'+
      '<div class="field">Prompt<textarea id="rprompt" rows="3" placeholder="SPP to Sablons west about leaving 07:00">SPP to Sablons west about leaving 07:00</textarea></div>'+
      '<button class="go" id="rparse">Build from prompt</button>'+
      '<p id="rparseOut" class="note">Names, side of Jersey/Minquiers, and a leave time are read from the sentence.</p>'+
      '<h2>Or build it</h2>')
    .replace('LIVE=null,GPS=null','LIVE=null,STREAMS=null,GPS=null')
    .replace(
      'function streamAt(min){\n  const hw=670, half=6.21*60;\n  const signed=1.65*Math.sin(Math.PI*(min-hw)/half);\n  const kn=Math.abs(signed);\n  const flood=signed<0;\n  return {kn:kn, signed:signed, dir:flood?155:335, phase:kn<0.28?"slack":(flood?"flood":"ebb")};\n}',
      'function hourAt(st,min){var rows=st.hours||[];if(!rows.length)return null;var i=0;while(i<rows.length-2&&rows[i+1].min<min)i++;var A=rows[i],B=rows[i+1]||A,t=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);var dA=+A.dir||0,dB=+B.dir||dA,dd=((dB-dA+540)%360)-180;return {kn:(+A.kn||0)+((+B.kn||0)-(+A.kn||0))*t,dir:((dA+dd*t)+360)%360,sl:(+A.sl||0)+((+B.sl||0)-(+A.sl||0))*t};}\n'+
      'function liveAt(lon,lat,min){if(!STREAMS||!STREAMS.stations)return null;var best=null,bd=99;STREAMS.stations.forEach(function(st){var d=Math.hypot((st.lon-lon)*0.72,st.lat-lat);if(d<bd){bd=d;best=st;}});if(!best||bd>0.35)return null;var h=hourAt(best,min);if(!h)return null;h.phase=h.kn<0.28?"slack":((h.dir>330||h.dir<90)?"flood":"ebb");h.signed=(h.phase==="flood"?-1:1)*h.kn;return h;}\n'+
      'function streamAt(min){var live=liveAt(-2.30,49.10,min);if(live)return live;var hw=670,half=6.21*60,signed=1.65*Math.sin(Math.PI*(min-hw)/half),kn=Math.abs(signed),flood=signed<0;return {kn:kn,signed:signed,dir:flood?155:335,phase:kn<0.28?"slack":(flood?"flood":"ebb")};}'
    )
    .replace(
      'STN.forEach(function(st){\n    const kn=s.kn*st[2], rad=s.dir*Math.PI/180, len=6+kn*20;',
      'STN.forEach(function(st){\n    var loc=liveAt(st[0],st[1],+document.getElementById("t").value);\n    const kn=loc?loc.kn:(s.kn*st[2]), rad=(loc?loc.dir:s.dir)*Math.PI/180, len=6+kn*20;'
    )
    .replace('loadLive(); tick();','function loadStreams(){fetch("/api/streams").then(function(r){return r.json();}).then(function(d){if(d&&d.ok&&d.stations){STREAMS=d;var el=document.getElementById("src");if(el)el.textContent="MODEL · 8 km · station shafts";dirty=true;}}).catch(function(){});}\nloadLive(); loadStreams(); tick();');
  html=html.replace('</body>',patch+'</body>');
  document.open();
  document.write(html);
  document.close();
})
.catch(function(){
  document.body.style.cssText="color:#eef4fa;font-family:system-ui;padding:24px";
  document.body.textContent="Failed to load iMagellan. Hard-refresh.";
});
})();
</script>
</body>
</html>
