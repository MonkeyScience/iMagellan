<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#071018;color:#eef4fa;font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
#scale{flex:0 0 15px;display:flex;font-size:8px;font-weight:800;color:#111}
#scale span{flex:1;text-align:center;line-height:15px}
#mapwrap{flex:1;position:relative;background:#0a4a58}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#card{position:absolute;top:8px;left:8px;right:52px;background:#0e1620f2;border-radius:12px;padding:8px 10px;z-index:3}
#card .who{font-size:13px;font-weight:800}
#card .src{font-size:10px;color:#7dd3c7;margin:1px 0 5px}
#card .row{display:flex;gap:12px;flex-wrap:wrap}
#card .k{font-size:9px;color:#9bb0c3;text-transform:uppercase}
#card .v{font-size:17px;font-weight:800}
#card .sub{font-size:11px;color:#9bb0c3}
#tools{position:absolute;top:8px;right:6px;z-index:3;display:flex;flex-direction:column;gap:6px}
#tools button{width:36px;height:36px;border:0;border-radius:10px;background:#15202b;color:#eef4fa}
#hud{background:#101820;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.ctrl{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;color:#9bb0c3}
.ctrl b{color:#e6b35a;min-width:46px}
input[type=range]{flex:1;accent-color:#2dd4bf}
.note{font-size:10px;color:#7a8ea3;margin-top:3px}
</style></head>
<body>
<div id="app">
<div id="scale"><span style="background:#7ad7ff">0</span><span style="background:#7dff7a">5</span><span style="background:#b7f06e">10</span><span style="background:#d7f33a">15</span><span style="background:#ffe44a">20</span><span style="background:#ff9a2e">25</span><span style="background:#ff3b3b">30+</span></div>
<div id="mapwrap">
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<div id="card">
<div class="who" id="who">Channel</div>
<div class="src" id="src">Open-Meteo snapshot 18 Sep · Windy trails</div>
<div class="row">
<div><div class="k">Wind</div><div class="v" id="wv">12.5</div><div class="sub" id="wg">WSW G16</div></div>
<div><div class="k">Waves</div><div class="v" id="hs">1.4 m</div><div class="sub">7 s</div></div>
<div><div class="k">Gust</div><div class="v" id="gu">16</div></div>
</div></div>
<div id="tools"><button id="zi">+</button><button id="zo">−</button><button id="now">T</button></div>
</div>
<div id="hud">
<div class="ctrl"><span>Time</span><b id="tlab">12:00</b><input id="t" type="range" min="720" max="1380" value="720"/></div>
<div class="ctrl"><span>Zoom</span><b id="zlab">1.8×</b><input id="z" type="range" min="10" max="60" value="18"/></div>
<div class="ctrl"><span>Flow</span><b id="flab">1.0</b><input id="flow" type="range" min="4" max="20" value="10"/></div>
<div class="note">Windy method: fade trails, not hashed arrows. Wind from Open-Meteo. Not a chart.</div>
</div></div>
<script>
(function(){
const LON0=-2.78,LON1=-1.88,LAT0=48.54,LAT1=49.56;
const LAND=[
[[-2.67,49.50],[-2.60,49.51],[-2.52,49.51],[-2.50,49.49],[-2.51,49.455],[-2.525,49.42],[-2.55,49.415],[-2.60,49.42],[-2.66,49.44],[-2.70,49.47]],
[[-2.25,49.26],[-2.15,49.27],[-2.01,49.26],[-2.00,49.23],[-2.02,49.18],[-2.08,49.165],[-2.20,49.17],[-2.25,49.19],[-2.27,49.23]],
[[-2.34,49.03],[-2.20,49.04],[-2.00,49.02],[-1.93,48.98],[-1.98,48.90],[-2.10,48.88],[-2.28,48.90],[-2.35,48.96]],
[[-2.40,48.62],[-2.25,48.64],[-1.90,48.69],[-1.88,48.72],[-1.88,48.55],[-2.40,48.55]]
];
const WPS=[[-2.523,49.457],[-2.45,49.30],[-2.40,49.18],[-2.27,48.85],[-2.03,48.64]];
/* Fresh Open-Meteo snapshot Fri 18 Sep 2026 Europe/London — mid-Channel 49.30N 2.43W */
const SNAP=[
{min:720,tws:12.7,twd:249,gust:15.6,hs:1.42},
{min:780,tws:16.2,twd:260,gust:20.0,hs:1.40},
{min:840,tws:16.8,twd:245,gust:20.8,hs:1.38},
{min:900,tws:17.9,twd:250,gust:21.9,hs:1.36},
{min:960,tws:18.8,twd:261,gust:23.2,hs:1.34},
{min:1020,tws:19.2,twd:265,gust:23.8,hs:1.32},
{min:1080,tws:19.7,twd:265,gust:24.1,hs:1.30},
{min:1140,tws:20.7,twd:264,gust:25.7,hs:1.28}
];
let LIVE=null;
const wrap=d=>((d%360)+360)%360;
function cardDir(d){const n=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];return n[Math.floor(((d+11.25)%360)/22.5)];}
function hhmm(m){return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0");}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function inLand(lo,la){return (lo>-2.68&&lo<-2.50&&la>49.42&&la<49.51)||(lo>-2.25&&lo<-2.02&&la>49.17&&la<49.26)||(lo>-2.32&&lo<-1.98&&la>48.90&&la<49.03)||la<48.64;}
function spawn(){let lo,la,n=0;do{lo=LON0+Math.random()*(LON1-LON0);la=LAT0+Math.random()*(LAT1-LAT0);n++;}while(inLand(lo,la)&&n<40);return {lon:lo,lat:la,age:Math.random()*80};}
function stateAt(min){
  const src=LIVE||SNAP;
  let i=0; while(i<src.length-2 && src[i+1].min<min) i++;
  const A=src[i],B=src[i+1]||A,t=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);
  const lerp=(a,b)=>a+(b-a)*t;
  return {tws:lerp(A.tws,B.tws), twd:wrap(A.twd+(((B.twd-A.twd+540)%360)-180)*t), gust:lerp(A.gust||A.tws+3,B.gust||B.tws+3), hs:lerp(A.hs,B.hs)};
}
function wash(kn){
  if(kn<5) return "rgba(122,215,255,0.28)";
  if(kn<10) return "rgba(125,255,122,0.26)";
  if(kn<15) return "rgba(183,240,110,0.24)";
  if(kn<20) return "rgba(215,243,58,0.22)";
  if(kn<25) return "rgba(255,228,74,0.22)";
  return "rgba(255,154,46,0.22)";
}
const bg=document.getElementById("bg"), fg=document.getElementById("fg"), wrapEl=document.getElementById("mapwrap");
const bctx=bg.getContext("2d"), fctx=fg.getContext("2d");
const cam={z:1.8,lon:-2.42,lat:49.18}; let W=300,H=300,dirty=true;
const P=[]; for(let i=0;i<720;i++) P.push(spawn());
function resize(){
  const r=wrapEl.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
  W=Math.max(160,r.width|0); H=Math.max(180,r.height|0);
  [bg,fg].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";c.getContext("2d").setTransform(dpr,0,0,dpr,0,0);});
  dirty=true;
}
const X=lo=>{const s=(LON1-LON0)/cam.z; return (lo-(cam.lon-s/2))/s*W;};
const Y=la=>{const s=(LAT1-LAT0)/cam.z; return (cam.lat+s/2-la)/s*H;};
function paintBg(st){
  bctx.fillStyle="#0a4a58"; bctx.fillRect(0,0,W,H);
  bctx.fillStyle=wash(st.tws); bctx.fillRect(0,0,W,H);
  LAND.forEach((p,i)=>{bctx.beginPath(); p.forEach((q,k)=>{k?bctx.lineTo(X(q[0]),Y(q[1])):bctx.moveTo(X(q[0]),Y(q[1]));}); bctx.closePath(); bctx.fillStyle=i===3?"#3a2c22":"#1c2e24"; bctx.fill();});
  bctx.fillStyle="#eef4fa"; bctx.font="bold 12px sans-serif"; bctx.textAlign="center";
  [["Guernsey",-2.58,49.468],["Jersey",-2.12,49.215],["Sablons",-2.02,48.655]].forEach(([n,lo,la])=>bctx.fillText(n,X(lo),Y(la)));
  bctx.setLineDash([7,5]); bctx.strokeStyle="#e6b35a"; bctx.lineWidth=2; bctx.beginPath();
  WPS.forEach((p,i)=>{i?bctx.lineTo(X(p[0]),Y(p[1])):bctx.moveTo(X(p[0]),Y(p[1]));}); bctx.stroke(); bctx.setLineDash([]);
  const min=+document.getElementById("t").value;
  const frac=Math.max(0,Math.min(1,(min-720)/420));
  const i=Math.min(WPS.length-2,Math.floor(frac*(WPS.length-1))); const u=frac*(WPS.length-1)-i;
  const blo=WPS[i][0]+(WPS[i+1][0]-WPS[i][0])*u, bla=WPS[i][1]+(WPS[i+1][1]-WPS[i][1])*u;
  const bx=X(blo), by=Y(bla), rad=165*Math.PI/180;
  bctx.fillStyle="#fff"; bctx.strokeStyle="#111"; bctx.lineWidth=1.4;
  bctx.beginPath(); bctx.moveTo(bx+Math.sin(rad)*14, by-Math.cos(rad)*14); bctx.lineTo(bx+Math.sin(rad+2.45)*8, by-Math.cos(rad+2.45)*8); bctx.lineTo(bx+Math.sin(rad-2.45)*8, by-Math.cos(rad-2.45)*8); bctx.closePath(); bctx.fill(); bctx.stroke();
}
function tick(){
  const min=+document.getElementById("t").value;
  cam.z=+document.getElementById("z").value/10;
  const flow=+document.getElementById("flow").value/10;
  const st=stateAt(min);
  document.getElementById("tlab").textContent=hhmm(min);
  document.getElementById("zlab").textContent=cam.z.toFixed(1)+"×";
  document.getElementById("flab").textContent=flow.toFixed(1);
  document.getElementById("wv").textContent=st.tws.toFixed(1);
  document.getElementById("wg").textContent=cardDir(st.twd)+" G"+st.gust.toFixed(0);
  document.getElementById("hs").textContent=st.hs.toFixed(1)+" m";
  document.getElementById("gu").textContent=st.gust.toFixed(0);
  document.getElementById("who").textContent=hhmm(min)+" · mid-Channel";
  if(dirty){ paintBg(st); fctx.clearRect(0,0,W,H); dirty=false; }
  /* Windy trail fade — do NOT full-clear */
  fctx.fillStyle="rgba(10,74,88,0.10)"; fctx.fillRect(0,0,W,H);
  const to=(st.twd+180)*Math.PI/180;
  const step=0.00115*flow*(st.tws/12);
  fctx.lineCap="round"; fctx.lineWidth=1.15;
  for(let i=0;i<P.length;i++){
    const p=P[i];
    const x0=X(p.lon), y0=Y(p.lat);
    p.lon+=Math.sin(to)*step; p.lat+=Math.cos(to)*step; p.age++;
    if(p.age>90 || inLand(p.lon,p.lat) || p.lon<LON0||p.lon>LON1||p.lat<LAT0||p.lat>LAT1){ Object.assign(p,spawn()); continue; }
    const x1=X(p.lon), y1=Y(p.lat);
    fctx.strokeStyle="rgba(255,255,255,"+(0.18+0.55*(1-p.age/90))+")";
    fctx.beginPath(); fctx.moveTo(x0,y0); fctx.lineTo(x1,y1); fctx.stroke();
  }
  requestAnimationFrame(tick);
}
async function loadLive(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude=49.30&longitude=-2.43&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn&timezone=Europe/London&forecast_days=1";
    const m="https://marine-api.open-meteo.com/v1/marine?latitude=49.30&longitude=-2.43&hourly=wave_height&timezone=Europe/London&forecast_days=1";
    const [w,sea]=await Promise.all([fetch(u).then(r=>r.json()), fetch(m).then(r=>r.json())]);
    const hours=(w.hourly.time||[]).map((s,i)=>{
      const hm=s.split("T")[1].split(":");
      return {min:(+hm[0])*60+(+hm[1]||0), tws:w.hourly.wind_speed_10m[i], twd:w.hourly.wind_direction_10m[i], gust:w.hourly.wind_gusts_10m[i], hs:(sea.hourly&&sea.hourly.wave_height&&sea.hourly.wave_height[i])||1.4};
    }).filter(h=>h.min>=720 && h.min<=1380);
    if(hours.length>3){ LIVE=hours; document.getElementById("src").textContent="LIVE Open-Meteo · Windy trails"; }
  }catch(e){}
}
["t","z"].forEach(id=>document.getElementById(id).addEventListener("input",()=>dirty=true));
document.getElementById("zi").onclick=()=>{document.getElementById("z").value=Math.min(60,+document.getElementById("z").value+4); dirty=true;};
document.getElementById("zo").onclick=()=>{document.getElementById("z").value=Math.max(10,+document.getElementById("z").value-4); dirty=true;};
document.getElementById("now").onclick=()=>{document.getElementById("t").value=Math.max(720,Math.min(1380,nowMin())); dirty=true;};
let drag=null;
fg.addEventListener("pointerdown",ev=>{drag={x:ev.clientX,y:ev.clientY,lon:cam.lon,lat:cam.lat};});
fg.addEventListener("pointerup",()=>drag=null);
fg.addEventListener("pointermove",ev=>{if(!drag)return; const sL=(LON1-LON0)/cam.z,sA=(LAT1-LAT0)/cam.z; cam.lon=drag.lon-(ev.clientX-drag.x)/W*sL; cam.lat=drag.lat+(ev.clientY-drag.y)/H*sA; dirty=true;});
addEventListener("resize",resize);
const n=nowMin(); document.getElementById("t").value=n<720?720:(n>1380?1380:n);
resize(); loadLive(); tick();
})();
</script></body></html>
