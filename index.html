<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icon.svg"/>
<meta name="theme-color" content="#0a4a58"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;background:#071018;color:#eef4fa;font-family:ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#mapwrap{flex:1;min-height:48vh;position:relative;background:#0a4a42;touch-action:none}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#card{position:absolute;top:8px;left:8px;right:54px;max-width:360px;background:#0e1620f2;border-radius:12px;padding:8px 10px;z-index:3}
#card .who{font-size:13px;font-weight:800}
#card .src{font-size:10px;color:#2dd4bf;margin-top:1px}
#card .row{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
#card .k{font-size:10px;color:#9bb0c3;text-transform:uppercase}
#card .v{font-size:17px;font-weight:800}
#card .sub{font-size:11px;color:#9bb0c3}
#tools{position:absolute;top:8px;right:8px;z-index:3;display:flex;flex-direction:column;gap:6px}
#tools button{width:40px;height:40px;border:0;border-radius:12px;background:#0e1620f0;color:#e6b35a;font-size:16px}
#foot{padding:8px 10px max(12px,env(safe-area-inset-bottom));background:#071018;font-size:12px;color:#9bb0c3}
.ctrl{display:flex;align-items:center;gap:8px;margin:4px 0}
.ctrl span{width:52px}
.ctrl b{width:52px;color:#e6b35a;font-variant-numeric:tabular-nums}
.ctrl input{flex:1;accent-color:#2dd4bf}
#note{font-size:10px;color:#7a8b9a;margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <canvas id="c"></canvas>
    <div id="card"></div>
    <div id="tools">
      <button id="now" title="Now">T</button>
      <button id="gps" title="GPS">+</button>
      <button id="zi">+</button>
      <button id="zo">-</button>
    </div>
  </div>
  <div id="foot">
    <div class="ctrl"><span>Time</span><b id="clock">--:--</b><input id="t" type="range" min="390" max="1020" step="5" value="570"></div>
    <div class="ctrl"><span>Zoom</span><b id="zlab">2.0x</b><input id="z" type="range" min="10" max="60" step="1" value="20"></div>
    <div id="note">iMagellan · live Open-Meteo via /api/wx · not a chart</div>
  </div>
</div>
<script>
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
const LON0=-2.82, LON1=-1.88, LAT0=48.54, LAT1=49.58;
const WPTS=[[-2.526,49.455],[-2.43,49.28],[-2.30,49.00],[-2.16,48.80],[-2.025,48.639]];
const LAND=[
  [[-2.675,49.422],[-2.682,49.438],[-2.66,49.472],[-2.605,49.508],[-2.535,49.505],[-2.500,49.470],[-2.526,49.455],[-2.536,49.422],[-2.59,49.416],[-2.64,49.418]],
  [[-2.25,49.259],[-2.12,49.252],[-2.018,49.226],[-2.02,49.175],[-2.10,49.162],[-2.22,49.180],[-2.25,49.238]],
  [[-2.08,49.43],[-2.01,49.46],[-1.94,49.50],[-1.88,49.50],[-1.88,49.42],[-2.02,49.40]],
  [[-2.35,48.54],[-2.28,48.648],[-2.03,48.642],[-1.99,48.662],[-1.88,48.72],[-1.88,48.54]]
];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const wrap=d=>((d%360)+360)%360;
const compass=d=>{const n=["N","NE","E","SE","S","SW","W","NW"];return n[Math.round(wrap(d)/45)%8];};
function hhmm(min){min=((min%1440)+1440)%1440;return String(Math.floor(min/60)).padStart(2,"0")+":"+String(Math.round(min%60)).padStart(2,"0");}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
let LIVE=null, GPS=null;
async function loadWx(){try{LIVE=await (await fetch("/api/wx?lat=49.30&lon=-2.43")).json();}catch(e){LIVE=null;}}
function pickHour(min, times){if(!times||!times.length) return 0; let best=0,bd=1e9; times.forEach((s,k)=>{const m=Number(s.slice(11,13))*60+Number(s.slice(14,16)||0); const d=Math.abs(m-min); if(d<bd){bd=d;best=k;}}); return best;}
function liveNow(min){const fb={tws:12,twd:275,gust:16,hs:1.3,tp:8,src:"briefing"}; if(!LIVE||!LIVE.ok||!LIVE.weather) return fb; const w=LIVE.weather, m=LIVE.marine||{}; const i=pickHour(min, w.time); return {tws:w.wind_speed_10m&&w.wind_speed_10m[i], twd:w.wind_direction_10m&&w.wind_direction_10m[i], gust:w.wind_gusts_10m&&w.wind_gusts_10m[i], hs:(m.wave_height&&m.wave_height[i])||fb.hs, tp:(m.wave_period&&m.wave_period[i])||fb.tp, src:"Open-Meteo"};}
function streamAt(lon,lat,min){const age=(min-555)/60; const flood=age<0; const mag=Math.max(0.15, 1.8*Math.cos(Math.PI*age/6)); let dir=flood?155:335; if(lon>-2.25 && lat<49.2) dir=flood?95:275; if(lat<48.85) dir=flood?120:300; return {kn:mag, dir};}
const mapEl=document.getElementById("mapwrap"), canvas=document.getElementById("c");
const slT=document.getElementById("t"), slZ=document.getElementById("z");
let cam={lon:-2.32,lat:49.08,zoom:2}, W=320,H=320, drag=null;
const P=[]; for(let i=0;i<380;i++) P.push({lon:LON0+Math.random()*(LON1-LON0),lat:LAT0+Math.random()*(LAT1-LAT0),life:Math.random()});
function viewW(){return (LON1-LON0)/cam.zoom;} function viewH(){return (LAT1-LAT0)/cam.zoom;}
function xy(lon,lat){return [W/2+(lon-cam.lon)/viewW()*W, H/2-(lat-cam.lat)/viewH()*H];}
function inLand(lon,lat){return LAND.some(function(poly){let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; const hit=((yi>lat)!==(yj>lat)) && (lon<(xj-xi)*(lat-yi)/((yj-yi)||1e-9)+xi); if(hit) inside=!inside;} return inside;});}
function windWash(kn){if(kn<6) return "rgba(40,90,160,0.18)"; if(kn<10) return "rgba(50,160,90,0.22)"; if(kn<16) return "rgba(120,190,50,0.22)"; if(kn<22) return "rgba(210,180,40,0.22)"; return "rgba(220,90,30,0.22)";}
function draw(){
  const r=mapEl.getBoundingClientRect(); W=r.width; H=r.height;
  const dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.floor(W*dpr)||canvas.height!==Math.floor(H*dpr)){canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr); canvas.style.width=W+"px"; canvas.style.height=H+"px";}
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const min=+slT.value; cam.zoom=slZ.value/10;
  document.getElementById("clock").textContent=hhmm(min);
  document.getElementById("zlab").textContent=cam.zoom.toFixed(1)+"x";
  const wx=liveNow(min); const st=streamAt(cam.lon,cam.lat,min);
  ctx.fillStyle="#0a4a42"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=windWash(wx.tws||12); ctx.fillRect(0,0,W,H);
  LAND.forEach(function(poly,i){ctx.beginPath(); poly.forEach(function(p,k){const xyv=xy(p[0],p[1]); k?ctx.lineTo(xyv[0],xyv[1]):ctx.moveTo(xyv[0],xyv[1]);}); ctx.closePath(); ctx.fillStyle=i===3?"#3a3228":"#1c2a20"; ctx.fill();});
  ctx.strokeStyle="#e6b35a"; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath();
  WPTS.forEach(function(p,i){const xyv=xy(p[0],p[1]); i?ctx.lineTo(xyv[0],xyv[1]):ctx.moveTo(xyv[0],xyv[1]);}); ctx.stroke(); ctx.setLineDash([]);
  const to=((wx.twd||275)+180)*Math.PI/180; const spd=Math.max(0.4,(wx.tws||12)/12);
  ctx.lineCap="round";
  for(let i=0;i<P.length;i++){const p=P[i]; if(inLand(p.lon,p.lat)){p.lon=LON0+Math.random()*(LON1-LON0);p.lat=LAT0+Math.random()*(LAT1-LAT0);p.life=0.2;continue;}
    const xyv=xy(p.lon,p.lat);
    ctx.strokeStyle="rgba(255,255,255,"+(0.18+0.45*p.life)+")"; ctx.lineWidth=1.15;
    ctx.beginPath(); ctx.moveTo(xyv[0],xyv[1]); ctx.lineTo(xyv[0]+Math.sin(to)*16*spd, xyv[1]-Math.cos(to)*16*spd); ctx.stroke();
    p.lon+=Math.sin(to)*0.00035*spd; p.lat+=Math.cos(to)*0.00035*spd; p.life+=0.012;
    if(p.life>1||p.lon<LON0||p.lon>LON1||p.lat<LAT0||p.lat>LAT1){p.lon=LON0+Math.random()*(LON1-LON0);p.lat=LAT0+Math.random()*(LAT1-LAT0);p.life=0.15;}
  }
  const shafts=[[-2.52,49.40],[-2.40,49.22],[-2.28,49.02],[-2.18,48.82],[-2.08,48.68]];
  shafts.forEach(function(sxy){const s=streamAt(sxy[0],sxy[1],min); const xyv=xy(sxy[0],sxy[1]); const rad=s.dir*Math.PI/180; const len=18+s.kn*8;
    ctx.strokeStyle=s.dir>180?"#f9a8d4":"#5eead4"; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(xyv[0]-Math.sin(rad)*len*0.4,xyv[1]+Math.cos(rad)*len*0.4); ctx.lineTo(xyv[0]+Math.sin(rad)*len*0.6,xyv[1]-Math.cos(rad)*len*0.6); ctx.stroke();
    ctx.fillStyle=s.dir>180?"#f9a8d4":"#99f6e4"; ctx.font="10px system-ui"; ctx.fillText(s.kn.toFixed(1)+" kn", xyv[0]+6, xyv[1]-6);
  });
  const t=(min-450)/540; const ti=clamp(t,0,0.999)*(WPTS.length-1); const i0=Math.floor(ti), f=ti-i0;
  const bLon=lerp(WPTS[i0][0], WPTS[Math.min(i0+1,WPTS.length-1)][0], f);
  const bLat=lerp(WPTS[i0][1], WPTS[Math.min(i0+1,WPTS.length-1)][1], f);
  const b=xy(bLon,bLat);
  ctx.fillStyle="#111"; ctx.strokeStyle="#e6b35a"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(b[0],b[1]-13); ctx.lineTo(b[0]+8,b[1]+8); ctx.lineTo(b[0]-8,b[1]+8); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(GPS){const g=xy(GPS.lon,GPS.lat); ctx.strokeStyle="#67e8f9"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(g[0],g[1],8,0,6.3); ctx.stroke(); ctx.fillStyle="#67e8f9"; ctx.beginPath(); ctx.arc(g[0],g[1],3,0,6.3); ctx.fill();}
  document.getElementById("card").innerHTML="<div class=who>iMagellan · "+hhmm(min)+"</div><div class=src>"+wx.src+(LIVE&&LIVE.ok?" · live":" · fallback")+"</div><div class=row><div><div class=k>Wind</div><div class=v>"+((wx.tws||0).toFixed(0))+" kn</div><div class=sub>"+compass(wx.twd||0)+"</div></div><div><div class=k>Gust</div><div class=v>"+((wx.gust||0).toFixed(0))+"</div></div><div><div class=k>Waves</div><div class=v>"+(((wx.hs||1.3)*3.28).toFixed(1))+" ft</div></div><div><div class=k>Stream</div><div class=v>"+st.kn.toFixed(1)+" kn</div></div></div>";
}
document.getElementById("now").onclick=function(){slT.value=nowMin();};
document.getElementById("zi").onclick=function(){slZ.value=Math.min(60,+slZ.value+5);};
document.getElementById("zo").onclick=function(){slZ.value=Math.max(10,+slZ.value-5);};
document.getElementById("gps").onclick=function(){if(!navigator.geolocation)return; navigator.geolocation.getCurrentPosition(function(p){GPS={lat:p.coords.latitude,lon:p.coords.longitude}; cam.lon=GPS.lon; cam.lat=GPS.lat;},function(){},{enableHighAccuracy:true,timeout:8000});};
canvas.addEventListener("pointerdown",function(ev){drag={x:ev.clientX,y:ev.clientY,lon:cam.lon,lat:cam.lat};});
canvas.addEventListener("pointermove",function(ev){if(!drag)return; cam.lon=drag.lon-(ev.clientX-drag.x)/W*viewW(); cam.lat=drag.lat+(ev.clientY-drag.y)/H*viewH();});
canvas.addEventListener("pointerup",function(){drag=null;});
slT.value=String(clamp(nowMin(),390,1020));
loadWx();
(function loop(){draw(); requestAnimationFrame(loop);})();
</script>
</body></html>
