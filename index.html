<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<link rel="manifest" href="/manifest.webmanifest"/>
</head>
<body style="margin:0;background:#071018">
<script>
fetch("https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html",{cache:"no-store"})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
.then(function(html){
  document.open();
  document.write(html);
  document.close();
  var s=document.createElement("script");
  s.textContent="(function(){function hh(m){m=((+m%1440)+1440)%1440;var h=Math.floor(m/60),n=Math.floor(m%60);return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}function tx(id){var n=document.getElementById(id);return n&&n.textContent?n.textContent.replace(/^\\s+|\\s+$/g,''):'';}var CUR=null,TIDE=null;fetch('/api/streams').then(function(r){return r.json();}).then(function(d){CUR=d;paint();}).catch(function(){});fetch('/api/tides').then(function(r){return r.json();}).then(function(d){TIDE=d;paint();}).catch(function(){});function hourRow(rows,min){if(!rows||!rows.length)return null;var i=0;while(i<rows.length-2&&rows[i+1].min<min)i++;var A=rows[i],B=rows[i+1]||A,t=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);var kn=(+A.kn||0)+((+B.kn||0)-(+A.kn||0))*t;return {kn:kn,dir:+A.dir||0};}function gate(id,label,min){if(!CUR||!CUR.stations)return '';var st=CUR.stations.find(function(x){return x.id===id;});if(!st)return '';var row=hourRow(st.hours,min);if(!row)return '';var ph=row.kn<0.28?'slack':((row.dir<90||row.dir>270)?'flood':'ebb');return label+' '+ph+' '+row.kn.toFixed(1)+' kn';}function toMin(iso){if(!iso)return 0;var o={};new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(p){o[p.type]=p.value;});var off=Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(+o.year,+o.month-1,+o.day))/86400000);return off*1440+(+iso.slice(11,13))*60+(+iso.slice(14,16)||0);}function nxt(id,min){if(!TIDE||!TIDE.ports)return '';var p=TIDE.ports.find(function(x){return x.id===id;});if(!p||!p.events)return '';for(var i=0;i<p.events.length;i++){var e=p.events[i],m=toMin(e.t);if(m>min)return e.type+' '+hh(m)+' '+Number(e.h).toFixed(1)+' m';}return '';}function paint(){var sum=document.getElementById('rsum');if(!sum||!sum.parentNode)return;var el=document.getElementById('rbrief');if(!el){el=document.createElement('p');el.id='rbrief';el.className='note';el.style.cssText='white-space:pre-wrap;line-height:1.45';sum.parentNode.insertBefore(el,sum.nextSibling);}var depEl=document.getElementById('dep'),tEl=document.getElementById('t');if(!depEl||!tEl){el.textContent='Open Map once so the clocks exist, then come back to Route.';return;}var dep=+depEl.value,now=+tEl.value;var rf=document.getElementById('rfrom'),rt=document.getElementById('rto');var fn=rf&&rf.options[rf.selectedIndex]?rf.options[rf.selectedIndex].text:'St Peter Port';var tn=rt&&rt.options[rt.selectedIndex]?rt.options[rt.selectedIndex].text:'Les Sablons';var east=document.getElementById('vEJer')&&document.getElementById('vEJer').checked;var side=east?'east-about':'west-about';var other=east?'West-about keeps Jersey to starboard.':'East-about puts you the other side of Jersey and the Minquiers.';var lines=[];lines.push('Leave '+hh(dep)+' '+side+' from '+fn+' to '+tn+'.');lines.push('At leave: '+gate('russell','Little Russell',dep)+'; '+gate('minqw','Minquiers',dep)+'.');lines.push('At '+hh(now)+' you are '+ (tx('who')||'On passage')+'. '+tx('left')+' left. ETA '+tx('eta')+'.');lines.push('Now: '+gate('russell','Little Russell',now)+'; '+gate('minqw','Minquiers',now)+'. Wind '+tx('wv')+' '+tx('wg')+'.');var a=nxt('spp',now);if(a)lines.push('St Peter Port next '+a+' CD.');var b=nxt('sablons',now);if(b)lines.push('St-Malo next '+b+' CD.');lines.push('Why not the other way: '+other);lines.push('Planning sketch. Not a chart. Stream is the 8 km model.');el.textContent=lines.join('\\n');}setTimeout(paint,800);setInterval(paint,1000);})();";
  document.body.appendChild(s);
})
.catch(function(){
  document.body.style.cssText="color:#eef4fa;font-family:system-ui;padding:24px";
  document.body.textContent="Failed to load iMagellan. Hard-refresh.";
});
</script>
</body>
</html>
