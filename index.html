<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#071018;color:#eef4fa;font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
#scale{flex:0 0 14px;display:flex;font-size:8px;font-weight:800;color:#111}
#scale span{flex:1;text-align:center;line-height:14px}
#mapwrap{flex:1;position:relative;background:#0a4a58;touch-action:none}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#fg{pointer-events:none}
#card{position:absolute;top:8px;left:8px;right:52px;background:#0e1620f2;border-radius:12px;padding:8px 10px;z-index:3}
#card .who{font-size:13px;font-weight:800}
#card .src{font-size:10px;color:#7dd3c7;margin:1px 0 5px}
#card .row{display:flex;gap:12px;flex-wrap:wrap}
#card .k{font-size:9px;color:#9bb0c3;text-transform:uppercase}
#card .v{font-size:16px;font-weight:800}
#card .sub{font-size:11px;color:#9bb0c3}
#tools{position:absolute;top:8px;right:6px;z-index:3;display:flex;flex-direction:column;gap:6px}
#tools button{width:36px;height:36px;border:0;border-radius:10px;background:#15202b;color:#eef4fa}
#hud{background:#101820;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.hours{display:flex;gap:4px;overflow:auto;padding:3px 0}
.hours button{background:#1c2a36;color:#cfe3f4;border:0;border-radius:10px;padding:6px 8px;font-size:11px;font-weight:700}
.hours button.on{background:#14b8a6;color:#042f2e}
.ctrl{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px;color:#9bb0c3}
.ctrl b{color:#e6b35a;min-width:48px}
input[type=range]{flex:1;accent-color:#2dd4bf}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;margin-top:3px;color:#cfe3f4}
.chips button{background:#1c2a36;color:#eef4fa;border:0;border-radius:8px;padding:6px 8px;font-weight:700}
.note{font-size:10px;color:#7a8ea3;margin-top:3px}
</style></head>
<body>
<div id="app">
<div id="scale"><span style="background:#7ad7ff">0</span><span style="background:#7dff7a">5</span><span style="background:#b7f06e">10</span><span style="background:#d7f33a">15</span><span style="background:#ffe44a">20</span><span style="background:#ff3b3b">30+</span></div>
<div id="mapwrap">
<canvas id="bg"></canvas><canvas id="fg"></canvas>
<div id="card">
<div class="who" id="who">St Peter Port</div>
<div class="src" id="src">Depart slider rebuilds the passage</div>
<div class="row">
<div><div class="k">Wind</div><div class="v" id="wv">10</div><div class="sub" id="wg">W</div></div>
<div><div class="k">SOG</div><div class="v" id="sog">6.2</div><div class="sub" id="sd">flood</div></div>
<div><div class="k">ETA</div><div class="v" id="eta">16:30</div><div class="sub" id="left">nm left</div></div>
</div></div>
<div id="tools"><button id="zi">+</button><button id="zo">−</button><button id="now">T</button><button id="gps">⌖</button></div>
</div>
<div id="hud">
<div class="hours" id="hours"></div>
<div class="ctrl"><span>Time</span><b id="tlab">--</b><input id="t" type="range" min="360" max="1140" value="745"/></div>
<div class="ctrl"><span>Depart</span><b id="dlab">06:50</b><input id="dep" type="range" min="360" max="510" value="410"/></div>
<div class="ctrl"><span>Zoom</span><b id="zlab">1.8×</b><input id="z" type="range" min="10" max="60" value="18"/></div>
<div class="chips"><button id="pin">Drop pin</button><label><input type="checkbox" id="follow"/> Follow</label><span id="gpsstat">GPS off</span></div>
<div class="note">SOG = 32ft polar vs forecast wind + along-track stream. Cyan = GPS. Not a chart.</div>
</div></div>
<script>
(function(){
const LON0=-2.78,LON1=-1.88,LAT0=48.54,LAT1=49.56;
const LAND=[
[[-2.67,49.50],[-2.52,49.51],[-2.50,49.49],[-2.525,49.42],[-2.66,49.44],[-2.70,49.47]],
[[-2.25,49.26],[-2.01,49.26],[-2.02,49.18],[-2.20,49.17],[-2.27,49.23]],
[[-2.34,49.03],[-2.00,49.02],[-1.98,48.90],[-2.28,48.90]],
[[-2.40,48.62],[-1.90,48.69],[-1.88,48.55],[-2.40,48.55]]
];
const WPS=[[-2.5233,49.4567],[-2.528,49.422],[-2.45,49.30],[-2.40,49.18],[-2.383,48.995],[-2.267,48.85],[-2.08,48.72],[-2.032,48.68],[-2.0285,48.6407]];
function nmBetween(a,b){return Math.hypot((b[1]-a[1])*60,(b[0]-a[0])*60*Math.cos((a[1]+b[1])*Math.PI/360));}
function cogBetween(a,b){return (Math.atan2(b[0]-a[0], b[1]-a[1])*180/Math.PI+360)%360;}
const CUM=[0]; for(let i=1;i<WPS.length;i++) CUM.push(CUM[i-1]+nmBetween(WPS[i-1],WPS[i]));
const TOTAL=CUM[CUM.length-1];
function posAt(nm){nm=Math.max(0,Math.min(TOTAL,nm)); let i=0; while(i<CUM.length-2 && CUM[i+1]<nm) i++; const t=CUM[i+1]===CUM[i]?0:(nm-CUM[i])/(CUM[i+1]-CUM[i]); return {lon:WPS[i][0]+t*(WPS[i+1][0]-WPS[i][0]), lat:WPS[i][1]+t*(WPS[i+1][1]-WPS[i][1]), cog:cogBetween(WPS[i],WPS[i+1]), i:i};}
function placeAt(nm){if(nm<3)return"St Peter Port"; if(nm<18)return"South of Guernsey"; if(nm<32)return"West of Jersey"; if(nm<48)return"West of Minquiers"; return"Les Sablons";}
const SNAP=[
{min:360,tws:9.5,twd:285,gust:12,hs:1.46},{min:480,tws:10.2,twd:270,gust:13,hs:1.45},
{min:610,tws:11.0,twd:268,gust:14,hs:1.44},{min:720,tws:12.7,twd:249,gust:15.6,hs:1.42},
{min:780,tws:16.2,twd:260,gust:20,hs:1.40},{min:840,tws:16.8,twd:245,gust:20.8,hs:1.38},
{min:900,tws:17.9,twd:250,gust:21.9,hs:1.36},{min:1020,tws:19.2,twd:265,gust:23.8,hs:1.32}
];
let LIVE=null,GPS=null,watch=null,TABLE=null,TABDEP=-1;
const wrap=d=>((d%360)+360)%360;
function cardDir(d){const n=["N","NE","E","SE","S","SW","W","NW"];return n[Math.round(wrap(d)/45)%8];}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0");}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function inLand(lo,la){return(lo>-2.68&&lo<-2.50&&la>49.42&&la<49.51)||(lo>-2.25&&lo<-2.02&&la>49.17&&la<49.26)||(lo>-2.32&&lo<-1.98&&la>48.90&&la<49.03)||la<48.64;}
function spawn(){let lo,la,n=0;do{lo=LON0+Math.random()*(LON1-LON0);la=LAT0+Math.random()*(LAT1-LAT0);n++;}while(inLand(lo,la)&&n<40);return{lon:lo,lat:la,age:Math.random()*80};}
function stateAt(min){
  const src=LIVE||SNAP; let i=0; while(i<src.length-2 && src[i+1].min<min) i++;
  const A=src[i],B=src[i+1]||A,t=(min-A.min)/Math.max(1,(B.min||A.min+60)-A.min);
  const lerp=(a,b)=>a+(b-a)*t;
  return {tws:lerp(A.tws,B.tws), twd:wrap(A.twd+(((B.twd-A.twd+540)%360)-180)*t), gust:lerp(A.gust||A.tws+3,B.gust||B.tws+3), hs:lerp(A.hs,B.hs)};
}
function streamAt(min){
  const age=(min-670)/60; const flood=age<0;
  const kn=Math.max(0.12,1.7*Math.abs(Math.cos(Math.PI*age/6.2)));
  return {kn:kn, dir:flood?155:335, phase:Math.abs(age)<0.55?"slack":(flood?"flood":"ebb")};
}
function bsp(tws){ if(tws<6)return 3.2; if(tws<10)return 4.8; if(tws<14)return 5.9; if(tws<18)return 6.5; return 6.0; }
function sogAt(min,cog){
  const st=stateAt(min), s=streamAt(min);
  const along=s.kn*Math.cos((s.dir-cog)*Math.PI/180);
  return {sog:Math.max(2.3, bsp(st.tws)+along), st:st, s:s, along:along};
}
function buildTable(dep){
  const rows=[{min:dep,nm:0}]; let nm=0;
  for(let m=dep;m<dep+16*60 && nm<TOTAL;m+=5){
    const p=posAt(nm); const g=sogAt(m,p.cog);
    nm=Math.min(TOTAL, nm+g.sog*(5/60));
    rows.push({min:m+5,nm:nm,sog:g.sog});
  }
  return rows;
}
function nmAt(min,dep){
  if(!TABLE||TABDEP!==dep){ TABLE=buildTable(dep); TABDEP=dep; }
  if(min<=dep) return 0;
  let i=0; while(i<TABLE.length-2 && TABLE[i+1].min<min) i++;
  const A=TABLE[i],B=TABLE[i+1]||A,t=(min-A.min)/Math.max(1,(B.min-A.min)||1);
  return A.nm+(B.nm-A.nm)*t;
}
function etaMin(dep){
  if(!TABLE||TABDEP!==dep){ TABLE=buildTable(dep); TABDEP=dep; }
  const hit=TABLE.find(function(r){return r.nm>=TOTAL-0.05;});
  return hit?hit.min:dep+16*60;
}
function wash(kn){ if(kn<10)return"rgba(125,255,122,0.16)"; if(kn<16)return"rgba(183,240,110,0.16)"; return"rgba(215,243,58,0.14)"; }
const bg=document.getElementById("bg"), fg=document.getElementById("fg"), wrapEl=document.getElementById("mapwrap");
const bctx=bg.getContext("2d"), fctx=fg.getContext("2d");
const cam={z:1.8,lon:-2.42,lat:49.22}; let W=300,H=300,dirty=true;
const P=[],C=[]; for(let i=0;i<480;i++) P.push(spawn()); for(let i=0;i<200;i++) C.push(spawn());
function resize(){const r=wrapEl.getBoundingClientRect(),dpr=Math.min(1.5,devicePixelRatio||1); W=Math.max(160,r.width|0); H=Math.max(180,r.height|0); [bg,fg].forEach(function(c){c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";c.getContext("2d").setTransform(dpr,0,0,dpr,0,0);}); dirty=true;}
const X=function(lo){const s=(LON1-LON0)/cam.z; return (lo-(cam.lon-s/2))/s*W;};
const Y=function(la){const s=(LAT1-LAT0)/cam.z; return (cam.lat+s/2-la)/s*H;};
function paintBg(st,boat){
  bctx.fillStyle="#0a4a58"; bctx.fillRect(0,0,W,H);
  bctx.fillStyle=wash(st.tws); bctx.fillRect(0,0,W,H);
  LAND.forEach(function(p,i){bctx.beginPath(); p.forEach(function(q,k){k?bctx.lineTo(X(q[0]),Y(q[1])):bctx.moveTo(X(q[0]),Y(q[1]));}); bctx.closePath(); bctx.fillStyle=i===3?"#3a2c22":"#1c2e24"; bctx.fill();});
  bctx.fillStyle="#eef4fa"; bctx.font="bold 12px sans-serif"; bctx.textAlign="center";
  [["Guernsey",-2.58,49.468],["Jersey",-2.12,49.215],["Sablons",-2.02,48.655]].forEach(function(a){bctx.fillText(a[0],X(a[1]),Y(a[2]));});
  bctx.setLineDash([7,5]); bctx.strokeStyle="#e6b35a"; bctx.lineWidth=2; bctx.beginPath();
  WPS.forEach(function(p,i){i?bctx.lineTo(X(p[0]),Y(p[1])):bctx.moveTo(X(p[0]),Y(p[1]));}); bctx.stroke(); bctx.setLineDash([]);
  const bx=X(boat.lon), by=Y(boat.lat), rad=boat.cog*Math.PI/180;
  bctx.fillStyle="#fff"; bctx.strokeStyle="#111"; bctx.lineWidth=1.4;
  bctx.beginPath(); bctx.moveTo(bx+Math.sin(rad)*14, by-Math.cos(rad)*14); bctx.lineTo(bx+Math.sin(rad+2.45)*8, by-Math.cos(rad+2.45)*8); bctx.lineTo(bx+Math.sin(rad-2.45)*8, by-Math.cos(rad-2.45)*8); bctx.closePath(); bctx.fill(); bctx.stroke();
  if(GPS){const gx=X(GPS.lon), gy=Y(GPS.lat); bctx.strokeStyle="#67e8f9"; bctx.lineWidth=2; bctx.beginPath(); bctx.arc(gx,gy,10,0,6.28); bctx.stroke(); bctx.fillStyle="#67e8f9"; bctx.beginPath(); bctx.arc(gx,gy,3,0,6.28); bctx.fill();}
}
function tick(){
  const min=+document.getElementById("t").value, dep=+document.getElementById("dep").value;
  cam.z=+document.getElementById("z").value/10;
  const nm=nmAt(min,dep), boat=posAt(nm), g=sogAt(min,boat.cog), eta=etaMin(dep);
  document.getElementById("tlab").textContent=hhmm(min);
  document.getElementById("dlab").textContent=hhmm(dep);
  document.getElementById("zlab").textContent=cam.z.toFixed(1)+"×";
  document.getElementById("wv").textContent=g.st.tws.toFixed(1);
  document.getElementById("wg").textContent=cardDir(g.st.twd)+" G"+g.st.gust.toFixed(0);
  document.getElementById("sog").textContent=g.sog.toFixed(1);
  document.getElementById("sd").textContent=cardDir(g.s.dir)+" "+g.s.phase;
  document.getElementById("eta").textContent=hhmm(eta);
  document.getElementById("left").textContent=(TOTAL-nm).toFixed(1)+" nm";
  document.getElementById("who").textContent=placeAt(nm);
  if(document.getElementById("follow").checked){ if(GPS){cam.lon=GPS.lon;cam.lat=GPS.lat;} else {cam.lon=boat.lon;cam.lat=boat.lat;} dirty=true; }
  if(dirty){ paintBg(g.st,boat); fctx.clearRect(0,0,W,H); dirty=false; }
  fctx.globalCompositeOperation="destination-out"; fctx.fillStyle="rgba(0,0,0,0.12)"; fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation="source-over"; fctx.lineCap="round";
  const to=(g.st.twd+180)*Math.PI/180, step=0.00105*(g.st.tws/12);
  fctx.lineWidth=1.1;
  for(let i=0;i<P.length;i++){const p=P[i],x0=X(p.lon),y0=Y(p.lat); p.lon+=Math.sin(to)*step; p.lat+=Math.cos(to)*step; p.age++; if(p.age>90||inLand(p.lon,p.lat)){Object.assign(p,spawn());continue;} fctx.strokeStyle="rgba(255,255,255,"+(0.16+0.5*(1-p.age/90))+")"; fctx.beginPath(); fctx.moveTo(x0,y0); fctx.lineTo(X(p.lon),Y(p.lat)); fctx.stroke();}
  const cd=g.s.dir*Math.PI/180, cs=0.00028*g.s.kn;
  const col=g.s.phase==="flood"?"rgba(45,212,191,":(g.s.phase==="ebb"?"rgba(251,113,133,":"rgba(148,163,184,");
  fctx.lineWidth=1.35;
  for(let i=0;i<C.length;i++){const p=C[i],x0=X(p.lon),y0=Y(p.lat); p.lon+=Math.sin(cd)*cs; p.lat+=Math.cos(cd)*cs; p.age++; if(p.age>110||inLand(p.lon,p.lat)){Object.assign(p,spawn());continue;} fctx.strokeStyle=col+(0.22+0.45*(1-p.age/110))+")"; fctx.beginPath(); fctx.moveTo(x0,y0); fctx.lineTo(X(p.lon),Y(p.lat)); fctx.stroke();}
  requestAnimationFrame(tick);
}
function rebuildHours(dep){
  const box=document.getElementById("hours"); box.innerHTML="";
  [dep, dep+60, dep+180, dep+360, etaMin(dep)].forEach(function(m,i){
    const labs=["Dep","+1h","+3h","+6h","ETA"];
    const b=document.createElement("button"); b.textContent=labs[i]+" "+hhmm(m); b.onclick=function(){document.getElementById("t").value=m; dirty=true;}; box.appendChild(b);
  });
}
document.getElementById("dep").addEventListener("input",function(){ TABDEP=-1; TABLE=null; rebuildHours(+this.value); dirty=true; });
document.getElementById("gps").onclick=function(){
  if(watch){ navigator.geolocation.clearWatch(watch); watch=null; GPS=null; document.getElementById("gpsstat").textContent="GPS off"; dirty=true; return; }
  if(!navigator.geolocation){ document.getElementById("gpsstat").textContent="no GPS"; return; }
  watch=navigator.geolocation.watchPosition(function(p){ GPS={lat:p.coords.latitude,lon:p.coords.longitude}; document.getElementById("gpsstat").textContent=GPS.lat.toFixed(3)+"N "+Math.abs(GPS.lon).toFixed(3)+"W"; document.getElementById("t").value=nowMin(); dirty=true; }, function(){ document.getElementById("gpsstat").textContent="GPS blocked"; }, {enableHighAccuracy:true,maximumAge:2000,timeout:10000});
};
document.getElementById("pin").onclick=function(){ GPS={lat:49.355,lon:-2.485}; document.getElementById("gpsstat").textContent="pin 49.36N 2.49W"; dirty=true; };
["t","z"].forEach(function(id){document.getElementById(id).addEventListener("input",function(){dirty=true;});});
document.getElementById("zi").onclick=function(){document.getElementById("z").value=Math.min(60,+document.getElementById("z").value+4);dirty=true;};
document.getElementById("zo").onclick=function(){document.getElementById("z").value=Math.max(10,+document.getElementById("z").value-4);dirty=true;};
document.getElementById("now").onclick=function(){document.getElementById("t").value=nowMin();dirty=true;};
let drag=null;
bg.addEventListener("pointerdown",function(ev){drag={x:ev.clientX,y:ev.clientY,lon:cam.lon,lat:cam.lat};});
bg.addEventListener("pointerup",function(){drag=null;});
bg.addEventListener("pointermove",function(ev){if(!drag)return; const sL=(LON1-LON0)/cam.z,sA=(LAT1-LAT0)/cam.z; cam.lon=drag.lon-(ev.clientX-drag.x)/W*sL; cam.lat=drag.lat+(ev.clientY-drag.y)/H*sA; dirty=true;});
async function loadLive(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude=49.30&longitude=-2.43&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn&timezone=Europe/London&forecast_days=1";
    const w=await (await fetch(u)).json();
    const hours=(w.hourly.time||[]).map(function(s,i){const hm=s.split("T")[1].split(":"); return {min:(+hm[0])*60+(+hm[1]||0), tws:w.hourly.wind_speed_10m[i], twd:w.hourly.wind_direction_10m[i], gust:w.hourly.wind_gusts_10m[i], hs:1.4};});
    if(hours.length>3){ LIVE=hours; TABDEP=-1; TABLE=null; document.getElementById("src").textContent="LIVE wind · stream integrator"; rebuildHours(+document.getElementById("dep").value); dirty=true; }
  }catch(e){}
}
addEventListener("resize",resize);
document.getElementById("t").value=nowMin();
rebuildHours(410); resize(); loadLive(); tick();
})();
</script></body></html>
