<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh;background:#071018;color:#eef4fa;font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#scale{height:14px;display:flex;font-size:9px;font-weight:800;color:#111}
#scale span{flex:1;text-align:center;line-height:14px}
#mapwrap{flex:1;position:relative;background:#0a4a58}
#mapwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#card{position:absolute;top:10px;left:10px;right:54px;background:#101820e8;border-radius:12px;padding:8px 10px;z-index:2}
#card b{display:block;font-size:13px}
#card small{color:#7dd3c7;font-size:10px}
#row{display:flex;gap:12px;margin-top:6px}
#row .k{font-size:9px;color:#9bb0c3;text-transform:uppercase}
#row .v{font-size:18px;font-weight:800}
#tools{position:absolute;top:10px;right:8px;z-index:2;display:flex;flex-direction:column;gap:6px}
#tools button{width:36px;height:36px;border:0;border-radius:10px;background:#15202b;color:#eef4fa}
#hud{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:#101820}
.ctrl{display:flex;gap:8px;align-items:center;font-size:12px;color:#9bb0c3;margin:3px 0}
.ctrl b{color:#e6b35a;min-width:44px}
input[type=range]{flex:1;accent-color:#2dd4bf}
</style></head>
<body>
<div id="app">
<div id="scale"><span style="background:#7ad7ff">0</span><span style="background:#7dff7a">5</span><span style="background:#b7f06e">10</span><span style="background:#d7f33a">15</span><span style="background:#ffe44a">20</span><span style="background:#ff3b3b">30</span></div>
<div id="mapwrap">
<div id="card"><b id="who">iMagellan</b><small id="src">pre-live renderer</small><div id="row"><div><div class="k">Wind</div><div class="v" id="wv">10</div></div><div><div class="k">Stream</div><div class="v" id="sv">1.4</div></div></div></div>
<div id="tools"><button id="zi">+</button><button id="zo">-</button><button id="now">T</button></div>
<canvas id="c"></canvas>
</div>
<div id="hud">
<div class="ctrl"><span>Time</span><b id="tl">10:40</b><input id="t" type="range" min="390" max="990" value="640"></div>
<div class="ctrl"><span>Zoom</span><b id="zl">1.8x</b><input id="z" type="range" min="10" max="70" value="18"></div>
</div></div>
<script>
const LON0=-2.78,LON1=-1.88,LAT0=48.54,LAT1=49.56,COS=Math.cos(49*Math.PI/180);
const LAND=[[[-2.67,49.50],[-2.52,49.51],[-2.50,49.46],[-2.53,49.42],[-2.66,49.44]],[[-2.25,49.26],[-2.02,49.23],[-2.08,49.17],[-2.25,49.19]],[[-2.34,49.03],[-2.00,49.02],[-1.98,48.90],[-2.28,48.90]],[[-2.40,48.62],[-2.05,48.64],[-1.88,48.72],[-1.88,48.54],[-2.40,48.54]]];
const WPS=[[-2.523,49.457],[-2.45,49.30],[-2.38,49.00],[-2.27,48.85],[-2.03,48.64]];
function inLand(lo,la){return(lo>-2.68&&lo<-2.50&&la>49.42&&la<49.51)||(lo>-2.25&&lo<-2.02&&la>49.17&&la<49.26)||(lo>-2.32&&lo<-1.98&&la>48.90&&la<49.03)||la<48.64;}
function spawn(){let lo,la,n=0;do{lo=LON0+Math.random()*(LON1-LON0);la=LAT0+Math.random()*(LAT1-LAT0);n++;}while(inLand(lo,la)&&n<30);return{lon:lo,lat:la,life:Math.random()};}
const P=[];for(let i=0;i<280;i++)P.push(spawn());
const cv=document.getElementById("c"),box=document.getElementById("mapwrap");
let W=300,H=300,cam={lon:-2.42,lat:49.22,z:1.8},drag=null;
function hhmm(m){return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0");}
function resize(){const r=box.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";cv.getContext("2d").setTransform(dpr,0,0,dpr,0,0);}
const vx=()=>(LON1-LON0)/cam.z, vy=()=>(LAT1-LAT0)/cam.z;
const X=lo=>W/2+(lo-cam.lon)/vx()*W, Y=la=>H/2-(la-cam.lat)/vy()*H;
function draw(){
  const ctx=cv.getContext("2d"),min=+document.getElementById("t").value;cam.z=+document.getElementById("z").value/10;
  document.getElementById("tl").textContent=hhmm(min);document.getElementById("zl").textContent=cam.z.toFixed(1)+"x";
  const tws=min<610?10:min<810?13:14, twd=min<810?270:255;
  ctx.fillStyle="#0a4a58";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(183,240,110,0.22)";ctx.fillRect(0,0,W,H);
  LAND.forEach((p,i)=>{ctx.beginPath();p.forEach((q,k)=>{k?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1]));});ctx.closePath();ctx.fillStyle=i===3?"#3a2c22":"#1c2e24";ctx.fill();});
  ctx.fillStyle="#eef4fa";ctx.font="12px sans-serif";ctx.textAlign="center";
  [["Guernsey",-2.58,49.47],["Jersey",-2.12,49.21],["Sablons",-2.02,48.65]].forEach(([n,lo,la])=>ctx.fillText(n,X(lo),Y(la)));
  ctx.strokeStyle="#e6b35a";ctx.setLineDash([6,4]);ctx.beginPath();WPS.forEach((p,i)=>{i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]));});ctx.stroke();ctx.setLineDash([]);
  const to=(twd+180)*Math.PI/180;ctx.lineCap="round";
  P.forEach(p=>{if(inLand(p.lon,p.lat))Object.assign(p,spawn());
    ctx.strokeStyle="rgba(255,255,255,"+(0.25+0.45*p.life)+")";ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(X(p.lon),Y(p.lat));ctx.lineTo(X(p.lon+Math.sin(to)*0.05),Y(p.lat+Math.cos(to)*0.05));ctx.stroke();
    p.lon+=Math.sin(to)*0.0016;p.lat+=Math.cos(to)*0.0016;p.life+=0.01;if(p.life>1)Object.assign(p,spawn());});
  const shafts=[[-2.50,49.43,165,1.4],[ -2.40,49.18,110,0.8],[ -2.20,48.86,90,0.7]];
  shafts.forEach(([lo,la,dir,kn])=>{const a=dir*Math.PI/180;ctx.strokeStyle="#2dd4bf";ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(X(lo),Y(la));ctx.lineTo(X(lo+Math.sin(a)*0.06),Y(la+Math.cos(a)*0.06));ctx.stroke();});
  const frac=Math.max(0,Math.min(1,(min-410)/580));const i=Math.min(WPS.length-2,Math.floor(frac*(WPS.length-1)));const u=frac*(WPS.length-1)-i;
  const blo=WPS[i][0]+(WPS[i+1][0]-WPS[i][0])*u,bla=WPS[i][1]+(WPS[i+1][1]-WPS[i][1])*u;
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(X(blo),Y(bla),6,0,7);ctx.fill();
  document.getElementById("who").textContent=frac<.25?"S of Guernsey":frac<.55?"West of Jersey":"Minquiers / Sablons";
  document.getElementById("wv").textContent=tws;document.getElementById("sv").textContent=(1.4-frac).toFixed(1);
  requestAnimationFrame(draw);
}
document.getElementById("zi").onclick=()=>{document.getElementById("z").value=Math.min(70,+document.getElementById("z").value+4);};
document.getElementById("zo").onclick=()=>{document.getElementById("z").value=Math.max(10,+document.getElementById("z").value-4);};
document.getElementById("now").onclick=()=>{const d=new Date();document.getElementById("t").value=d.getHours()*60+d.getMinutes();};
cv.addEventListener("pointerdown",e=>drag={x:e.clientX,y:e.clientY,lon:cam.lon,lat:cam.lat});
cv.addEventListener("pointerup",()=>drag=null);
cv.addEventListener("pointermove",e=>{if(!drag)return;cam.lon=drag.lon-(e.clientX-drag.x)/W*vx();cam.lat=drag.lat+(e.clientY-drag.y)/H*vy();});
addEventListener("resize",resize);resize();draw();
fetch("/api/health").then(r=>r.json()).then(j=>{if(j.ok)document.getElementById("src").textContent="pre-live map · API up";}).catch(()=>{});
</script></body></html>
