name: imagellan
region: lon
services:
  - name: web
    github:
      repo: MonkeyScience/iMagellan
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    run_command: uvicorn server:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
