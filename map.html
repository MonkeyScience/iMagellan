<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan — Map</title>
<meta name="theme-color" content="#071018"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icon.svg"/>
<style>
  body { margin: 0; background: #071018; color: #eef4fa; font-family: system-ui, sans-serif; }
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px; background: rgba(7,16,24,.92);
    border-bottom: 1px solid rgba(238,244,250,.12);
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  }
  .bar a { color: #e6b35a; text-decoration: none; }
  .bar span { color: #8aa0ad; }
  #fallback { padding: 24px; max-width: 420px; line-height: 1.5; color: #c5d4de; }
  #fallback code { color: #e6b35a; }
</style>
</head>
<body>
  <div class="bar">
    <a href="/">← Live brief</a>
    <span>Map · secondary · early build</span>
  </div>
  <div id="fallback">
    Loading map shell… If this stays blank, open the <a href="/" style="color:#e6b35a">Live brief</a> instead. Plotter stays primary.
  </div>
  <script>
  (function () {
    var q = location.search || "";
    // Prefer full local map shell (UI + OpenSeaMap seamarks). Fall back to pinned CDN.
    var LOCAL = "/cdn-map-shell.html" + q;
    var PIN = "https://cdn.jsdelivr.net/gh/MonkeyScience/iMagellan@d367c87594740177f7ddbb664b005b65a835b40e/index.html";
    function injectBack() {
      if (!document.querySelector('a[href="/"]')) {
        var bar = document.createElement("div");
        bar.style.cssText = "position:fixed;top:8px;left:8px;z-index:9999;background:rgba(7,16,24,.9);border:1px solid rgba(230,179,90,.4);border-radius:100px;padding:6px 12px;font:12px system-ui";
        bar.innerHTML = '<a href="/" style="color:#e6b35a;text-decoration:none">← Live brief</a>';
        document.body.appendChild(bar);
      }
      var s = document.createElement("script");
      s.src = "/app.js?v=brief2";
      s.onerror = function () { console.warn("app.js missing"); };
      document.body.appendChild(s);
    }
    function write(html) {
      document.open();
      document.write(html);
      document.close();
      injectBack();
    }
    fetch(LOCAL, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(write)
      .catch(function () {
        fetch(PIN, { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (html) {
            html = html.replace("function streamAt(min){", "function streamAt(min){if(window.__smocAt){var u=window.__smocAt(min);if(u)return u;}");
            html = html.replace("slack-safe stream", "8 km stream");
            html = html.replace("function stateAt(min){", "function stateAt(min){min=((+min%1440)+1440)%1440;");
            html = html.replace(
              "const kn=s.kn*st[2], rad=s.dir*Math.PI/180, len=6+kn*20;",
              "var loc=window.__smocStn?window.__smocStn(st[0],st[1],s):null;const kn=(loc?loc.kn:s.kn*st[2]), rad=(loc?loc.dir:s.dir)*Math.PI/180, len=6+kn*20;"
            );
            write(html);
          })
          .catch(function () {
            var f = document.getElementById("fallback");
            if (f) {
              f.innerHTML = "Map shell could not load. Use the <a href=\"/\" style=\"color:#e6b35a\">Live brief</a> — it does not need the legacy shell. <code>NOT A CHART · PLOTTER PRIMARY</code>";
            }
          });
      });
  })();
  </script>
</body>
</html>
