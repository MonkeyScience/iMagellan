<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan</title>
<meta name="theme-color" content="#0a4a58"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;max-height:100dvh;background:#071018;color:#eef4fa;font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:100dvh;min-height:0}
#view-map{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
#scale{flex:0 0 10px;display:flex;font-size:8px;font-weight:800;color:#111}
#scale span{flex:1;text-align:center;line-height:10px}
#mapwrap{flex:1 1 auto;position:relative;background:#0a4a58;touch-action:none;min-height:0;min-width:0}
#mapwrap canvas#bg,#mapwrap canvas#fg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fg{pointer-events:none}
#card{position:absolute;top:max(6px,env(safe-area-inset-top));left:6px;right:48px;background:#0e1620f2;border-radius:12px;padding:6px 8px;z-index:3;max-width:calc(100% - 54px)}
#card .who{font-size:12px;font-weight:800}
#card .src{font-size:9px;color:#7dd3c7;margin:1px 0 4px}
#card .row{display:flex;gap:8px;flex-wrap:wrap}
#card .k{font-size:8px;color:#9bb0c3;text-transform:uppercase}
#card .v{font-size:14px;font-weight:800}
#card .sub{font-size:10px;color:#9bb0c3}
#tools{position:absolute;top:max(6px,env(safe-area-inset-top));right:4px;z-index:3;display:flex;flex-direction:column;gap:5px}
#tools button{width:34px;height:34px;border:0;border-radius:10px;background:#15202b;color:#eef4fa;font-size:13px}
#tideStrip{flex:0 0 auto;display:none;flex-direction:column;background:#0b1218;border-top:1px solid #1e2a36;padding:4px 8px 6px;gap:2px}
#tideStrip.on{display:flex}
#tideStrip .tr{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#9bb0c3;flex-wrap:wrap}
#tideStrip .tr b{color:#e6b35a;font-weight:700}
canvas.tgmap{width:100%;height:118px;background:#101820;border-radius:8px;display:block}
#hud{flex:0 0 auto;background:#101820;padding:6px 10px 4px;max-height:min(34vh,260px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.hours{display:flex;gap:4px;overflow:auto;padding:1px 0 2px}
.hours button{background:#1c2a36;color:#cfe3f4;border:0;border-radius:8px;padding:5px 7px;font-size:10px;font-weight:700;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:11px;color:#9bb0c3}
.ctrl b{color:#e6b35a;min-width:40px;font-size:11px}
.ctrl select,.field input,.field select{background:#1c2a36;color:#eef4fa;border:0;border-radius:8px;padding:5px 6px;font-size:11px}
input[type=range]{flex:1;accent-color:#2dd4bf;min-width:0}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:#cfe3f4}
.chips label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.note{font for_trunc
