<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>iMagellan — Map</title>
<meta name="theme-color" content="#071018"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html,body{margin:0;height:100%;background:#071018;color:#eef4fa;font-family:system-ui,sans-serif}
  .bar{position:sticky;top:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:10px 14px;background:rgba(7,16,24,.92);border-bottom:1px solid rgba(238,244,250,.12);
    font-size:12px;letter-spacing:.06em}
  .bar a{color:#e6b35a;text-decoration:none}
  .bar label{color:#c5d4de;display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0}
  #map{height:calc(100dvh - 44px);width:100%;background:#0a4a58}
  .note{position:fixed;bottom:10px;left:10px;right:10px;z-index:1000;font-size:11px;color:#8aa0ad;
    background:rgba(7,16,24,.85);border:1px solid rgba(230,179,90,.35);border-radius:10px;padding:8px 10px}
</style>
</head>
<body>
  <div class="bar">
    <a href="/">← Live brief</a>
    <label><input type="checkbox" id="seams" checked/> OpenSeaMap seamarks</label>
    <span style="color:#8aa0ad">NOT A CHART · PLOTTER PRIMARY</span>
  </div>
  <div id="map"></div>
  <div class="note">OpenSeaMap seamarks overlay (drying rocks, marks). Planning sketch only — plotter stays primary. Default route St Peter Port → Les Sablons.</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function(){
    var q = new URLSearchParams(location.search);
    var seamsEl = document.getElementById("seams");
    try {
      var ls = localStorage.getItem("imagellan_seams");
      if (q.get("seams") === "0" || ls === "0") seamsEl.checked = false;
      if (q.get("seams") === "1" || ls === "1") seamsEl.checked = true;
    } catch (e) {}

    // Channel Islands focus: SPP → Sablons
    var map = L.map("map", { zoomControl: true }).setView([49.05, -2.25], 9);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    var seamarks = L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenSeaMap"
    });
    if (seamsEl.checked) seamarks.addTo(map);

    var spp = L.marker([49.4567, -2.5233]).addTo(map).bindPopup("St Peter Port");
    var sab = L.marker([48.6407, -2.0285]).addTo(map).bindPopup("Les Sablons");
    var route = L.polyline([[49.4567,-2.5233],[49.43,-2.52],[49.2,-2.4],[48.97,-2.32],[48.6407,-2.0285]], {
      color: "#e6b35a", weight: 2, dashArray: "6 6", opacity: 0.85
    }).addTo(map);

    seamsEl.addEventListener("change", function(){
      try { localStorage.setItem("imagellan_seams", seamsEl.checked ? "1" : "0"); } catch (e) {}
      if (seamsEl.checked) seamarks.addTo(map); else map.removeLayer(seamarks);
    });
  })();
  </script>
</body>
</html>
